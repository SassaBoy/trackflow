<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Service Notice</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ffffff;
    color:#000000;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:650px;
    text-align:center;
    padding:40px;
    border:2px solid #000;
}

h1{
    font-size:34px;
    margin-bottom:15px;
    letter-spacing:1px;
}

h2{
    font-size:22px;
    margin-bottom:20px;
    font-weight:normal;
}

p{
    font-size:18px;
    line-height:1.6;
    margin-bottom:15px;
}

.notice{
    border:1px solid #000;
    padding:15px;
    margin:20px 0;
    font-weight:bold;
}

.footer{
    margin-top:25px;
    font-size:14px;
}
</style>

</head>
<body>

<div class="container">

<h1>RENDER.COM</h1>

<h2>Service Notice</h2>

<div class="notice">
Your free 30-day trial has ended.
</div>

<p>
Access to This Service has been temporarily suspended.
</p>

<p>
To continue using this service, please contact Customer Service.
</p>

<div class="footer">
Status: OFFLINE
</div>

</div>

</body>
</html>
